<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TokenVeil</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="pop-card">
    <div class="pop-head">
      <span class="pop-logo">TokenVeil</span>
      <span class="pop-ver">v1.0.0</span>
    </div>

    <div class="pop-body">
      <div class="pop-row">
        <span class="pop-label">Status</span>
        <span class="pop-badge" id="status">Active</span>
      </div>
      <div class="pop-row">
        <span class="pop-label">Site</span>
        <span class="pop-val">claude.ai</span>
      </div>

      <div class="pop-divider"></div>

      <p class="pop-info">
        Open Claude and look for the small pill in the bottom-right corner.
        Click it to expand and see context, session, and weekly usage.
      </p>

      <a class="pop-btn" id="open-claude">Open Claude →</a>
    </div>

    <div class="pop-foot">
      No tracking. No external servers. All local.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
